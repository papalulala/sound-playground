<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>博愛黑馬 聲音魔法秀</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 15% 10%,#fff4d9,transparent 38%),radial-gradient(circle at 90% 88%,#d8eaf0,transparent 40%),#f5f1e8;font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#263648}main{width:min(1080px,100%);text-align:center}h1{font-size:clamp(34px,5vw,62px);margin:12px 0}p{color:#6c7880;font-size:19px;margin:0 0 40px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.sound{cursor:pointer;border:3px solid white;border-radius:30px;min-height:295px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 15px 35px #2b39431b;transition:.2s}.sound:hover{transform:translateY(-7px)}.sound.active{outline:4px solid #376b91}.horse{background:#ffe5b8}.thunder{background:#dce7ff}.drum{background:#f9d9d0}.emoji{font-size:95px}.name{font-size:34px;font-weight:900}.stop{margin-top:28px;background:#273f4e;color:white;border:0;border-radius:40px;padding:15px 40px;font-weight:bold;font-size:18px;cursor:pointer}#status{margin-top:24px;font-weight:bold;min-height:25px}@media(max-width:690px){.grid{grid-template-columns:1fr}.sound{min-height:140px;flex-direction:row;gap:18px}.emoji{font-size:65px}.name{font-size:28px}}</style></head><body><main><h1>🐎 博愛黑馬 聲音魔法秀</h1><p>一場精彩的行進演出，藏著那些神奇的聲音？<br>動動手指，為博愛黑馬加上你的專屬音效</p><div class="grid"><button class="sound horse" data-key="wind"><span class="emoji">🌬️</span><span class="name">風聲</span></button><button class="sound thunder" data-key="horse"><span class="emoji">🐎</span><span class="name">馬聲</span></button><button class="sound drum" data-key="thunder"><span class="emoji">⛈️</span><span class="name">雷聲</span></button></div><button class="stop" id="stop">■ 停止播放</button><div id="status" aria-live="polite">請選擇一種聲音</div><p style="font-size:13px;margin-top:18px">可使用鍵盤 1、2、3 播放，Esc 停止</p></main><script>
const files={wind:"01_01_Wind.wav",horse:"01_02_Horse.wav",thunder:"03_01_Stampede Impact.wav"},names={wind:"風聲",horse:"馬聲",thunder:"雷聲"};let player=new Audio();const buttons=[...document.querySelectorAll(".sound")],status=document.getElementById("status");function stop(){player.pause();player.currentTime=0;buttons.forEach(b=>b.classList.remove("active"));status.textContent="請選擇一種聲音"}async function play(key){stop();const b=document.querySelector('[data-key="'+key+'"]');b.classList.add("active");player.src=files[key];status.textContent="正在播放："+names[key];try{await player.play()}catch(e){b.classList.remove("active");status.textContent="播放失敗：請確認 "+files[key]+" 已上傳至網站根目錄"}}buttons.forEach(b=>b.onclick=()=>play(b.dataset.key));document.getElementById("stop").onclick=stop;player.onended=stop;document.addEventListener("keydown",e=>{if(e.repeat)return;const k={"1":"wind","2":"horse","3":"thunder"}[e.key];if(k)play(k);if(e.key==="Escape")stop()});
</script></body></html>
